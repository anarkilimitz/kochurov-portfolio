name: Deploy to Vimexx

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VIMEXX_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add Vimexx host to known_hosts
        run: |
          ssh-keyscan -4 -T 10 -p "${{ secrets.VIMEXX_PORT }}" "${{ secrets.VIMEXX_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload dist to Vimexx
        run: |
          scp -P "${{ secrets.VIMEXX_PORT }}" -r dist/. \
            "${{ secrets.VIMEXX_USER }}@${{ secrets.VIMEXX_HOST }}:${{ secrets.VIMEXX_PATH }}"
